# Local development dependencies. Production equivalents live in Coolify;
# see infra/coolify.md. Start with: pnpm infra:up
name: ai-video-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command:
      - postgres
      # Laptop-friendly; production values are in infra/coolify.md.
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 1g

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      # AOF on and noeviction: BullMQ must never lose or evict job entries.
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

volumes:
  postgres-data:
  redis-data:
