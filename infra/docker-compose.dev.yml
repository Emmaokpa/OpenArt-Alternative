# Local development dependencies. Production equivalents live in Coolify;
# see infra/coolify.md. Start with: pnpm infra:up
name: ai-video-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command:
      - postgres
      # Laptop-friendly; production values are in infra/coolify.md.
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 1g

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      # AOF on and noeviction: BullMQ must never lose or evict job entries.
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  # S3-compatible object storage for development. R2 is the production target;
  # MinIO's community images are no longer published, so LocalStack's S3
  # service stands in. The AWS SDK code is identical for both.
  localstack:
    image: localstack/localstack:4.5
    restart: unless-stopped
    environment:
      SERVICES: s3
      PERSISTENCE: 0
      DEBUG: 0
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 1g

  # Creates the buckets once LocalStack is healthy. Idempotent, exits 0.
  localstack-init:
    image: localstack/localstack:4.5
    depends_on:
      localstack:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        awslocal s3 mb s3://app-private --endpoint-url http://localstack:4566 || true
        awslocal s3 mb s3://app-public --endpoint-url http://localstack:4566 || true
        awslocal s3 mb s3://app-backups --endpoint-url http://localstack:4566 || true
        echo "buckets ready"
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    restart: "no"
    mem_limit: 256m

volumes:
  postgres-data:
  redis-data:
  localstack-data:
